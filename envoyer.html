<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Envoyer une photo</title>
<style>
  :root { --bg:#f4f1ea; --card:#fff; --ink:#1d1d1f; --muted:#6e6e73; --accent:#1d1d1f; --ok:#2e7d32; --err:#c62828; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  [hidden] { display:none !important; }
  body { margin:0; font-family:-apple-system, system-ui, sans-serif; background:var(--bg); color:var(--ink); }
  main { max-width:480px; margin:0 auto; padding:20px 16px 40px; }
  h1 { font-size:22px; margin:4px 0 6px; }
  p.intro { color:var(--muted); font-size:15px; margin:0 0 16px; line-height:1.4; }
  .card { background:var(--card); border-radius:16px; padding:16px; margin-bottom:14px; box-shadow:0 1px 3px rgba(0,0,0,.06); }
  button, .filebtn { display:block; width:100%; border:0; border-radius:12px; padding:15px; font-size:17px; font-weight:600;
           background:var(--accent); color:#fff; text-align:center; cursor:pointer; }
  .filebtn.secondary { background:#e8e6e0; color:var(--ink); }
  button:disabled { opacity:.35; }
  input[type=file] { display:none; }
  label.field { display:block; font-size:14px; margin:0 0 4px; }
  input[type=text] { width:100%; font-size:16px; padding:10px; border-radius:10px; border:1px solid #ccc; background:#fff; }
  .preview { margin:12px 0; display:flex; justify-content:center; align-items:center; min-height:120px;
             border:1px dashed #ccc; border-radius:12px; overflow:hidden; background:#fff; }
  .preview canvas { width:100%; max-width:384px; display:block; image-rendering:pixelated; }
  .look label { display:flex; justify-content:space-between; font-size:14px; margin:12px 0 4px; }
  .look input[type=range] { width:100%; }
  .look .row { display:flex; gap:10px; align-items:center; margin-top:10px; }
  .look .check { display:flex; align-items:center; gap:8px; font-size:14px; margin:0; flex:1; }
  .look .check input { width:22px; height:22px; margin:0; }
  .look button.small { width:auto; padding:8px 12px; font-size:14px; background:#e8e6e0; color:var(--ink); }
  .modes { display:flex; gap:10px; margin-top:4px; }
  .modes button { flex:1; padding:12px 6px; font-size:15px; }
  .modes button.secondary { background:#e8e6e0; color:var(--ink); }
  .fondHint { color:var(--muted); font-size:13px; margin-top:6px; }
  .modeLabel { text-align:center; color:var(--muted); font-size:13px; margin-top:-4px; }
  .empty { color:var(--muted); font-size:14px; }
  #status { font-size:14px; color:var(--muted); margin-top:10px; text-align:center; line-height:1.4; }
  #status.ok { color:var(--ok); } #status.err { color:var(--err); }
  .count { text-align:center; color:var(--muted); font-size:13px; margin-top:6px; }
</style>
</head>
<body>
<main>
  <h1>📲 Envoyer une photo</h1>
  <p class="intro">Ta photo part vers l'imprimante et sort sur un petit ticket. Règle la luminosité et le contraste (et supprime le fond si tu veux) : l'aperçu montre le ticket tel qu'il sera imprimé.</p>

  <div class="card">
    <label class="field" for="from">Ton prénom (optionnel)</label>
    <input type="text" id="from" maxlength="30" placeholder="ex. Camille">
  </div>

  <div class="card">
    <label class="filebtn secondary">🖼️ Choisir une photo<input type="file" id="fileInput" accept="image/*"></label>
    <div class="preview"><canvas id="previewCanvas" hidden></canvas><span class="empty" id="emptyMsg">Aucune photo choisie</span></div>
    <div class="modeLabel" id="modeLabel" hidden></div>
    <!-- Réglages de la photo : l'aperçu montre exactement le ticket -->
    <div class="look" id="lookBox" hidden>
      <div class="modes" id="modeRow">
        <button data-mode="nb">⚡ Noir et blanc</button>
        <button data-mode="gris" class="secondary">✨ Gris</button>
      </div>
      <label>☀️ Luminosité <span id="brightVal">0</span></label>
      <input type="range" id="bright" min="-100" max="100" value="0">
      <label>◐ Contraste <span id="contrastVal">0</span></label>
      <input type="range" id="contrast" min="-100" max="100" value="0">
      <div class="row">
        <label class="check"><input type="checkbox" id="autoEnhance" checked> ✨ Correction auto</label>
        <button class="small" id="resetLook" hidden>↺ Remettre à zéro</button>
      </div>
      <div class="row">
        <label class="check"><input type="checkbox" id="removeBg"> 🧍 Supprimer le fond (garde les personnes)</label>
      </div>
      <div class="fondHint" id="fondHint"></div>
    </div>
    <div style="height:12px"></div>
    <button id="sendBtn" disabled>Envoyer</button>
    <div id="status">Connexion au téléphone de l'imprimante…</div>
    <div class="count" id="count"></div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="traitement.js"></script>
<script>
/* Page des invités : on se relie directement (WebRTC, via PeerJS) au téléphone
   qui pilote l'imprimante. Son identifiant est dans l'adresse, après le « # ». */
const hostId = decodeURIComponent(location.hash.slice(1));
const statusEl = document.getElementById('status');
const sendBtn = document.getElementById('sendBtn');
const fromEl = document.getElementById('from');
let conn = null, ready = false, photo = null, sentCount = 0, peer = null;

function setStatus(t, kind = '') { statusEl.textContent = t; statusEl.className = kind; }
function updateBtn() { sendBtn.disabled = !(ready && photo); }

try { fromEl.value = localStorage.getItem('x6h-prenom') || ''; } catch (_) {}
fromEl.oninput = () => { try { localStorage.setItem('x6h-prenom', fromEl.value); } catch (_) {} };

function connect() {
  if (!hostId) { setStatus('Lien incomplet : scanne à nouveau le QR code.', 'err'); return; }
  if (typeof Peer === 'undefined') { setStatus('Pas de connexion internet.', 'err'); return; }
  setStatus('Connexion au téléphone de l\'imprimante…');
  if (!peer || peer.destroyed) {
    peer = new Peer();
    peer.on('error', e => {
      ready = false; updateBtn();
      if (e.type === 'peer-unavailable')
        setStatus('Le téléphone de l\'imprimante est introuvable. Sa page doit rester ouverte à l\'écran. Réessaie dans un instant.', 'err');
      else setStatus('Problème de connexion (' + e.type + '). Réessaie dans un instant.', 'err');
      setTimeout(retry, 4000);
    });
    peer.on('open', openConn);
  } else openConn();
}

function openConn() {
  conn = peer.connect(hostId, { reliable: true, serialization: 'binary' });
  conn.on('open', () => { ready = true; updateBtn(); setStatus('Connecté ✓ Choisis une photo puis touche Envoyer.', 'ok'); });
  conn.on('data', d => {
    // Réglages de l'imprimante (N&B ou Gris) : l'aperçu se met dans le même mode
    if (d && d.type === 'reglages') { if (d.mode) { hostMode = d.mode; showModeButtons(); renderPreview(); } return; }
    // Mode borne : le téléphone (ou l'ordinateur) de l'imprimante dit où en est la photo
    if (d && d.type === 'etat') {
      if (d.etat === 'file') setStatus('Photo reçue ✓ Elle va être imprimée…', 'ok');
      else if (d.etat === 'imprimee') setStatus('Ta photo est imprimée ✓ 🎉 Tu peux en envoyer une autre.', 'ok');
      else if (d.etat === 'attente') setStatus('Ta photo est en attente : l\'imprimante n\'a plus de papier (ou n\'est pas prête). Elle sera imprimée dès que possible.', 'err');
      return;
    }
    if (d && d.type === 'recu') {
      sentCount++;
      setStatus('Photo envoyée ✓ Tu peux en envoyer une autre.', 'ok');
      document.getElementById('count').textContent = sentCount + ' photo' + (sentCount > 1 ? 's' : '') + ' envoyée' + (sentCount > 1 ? 's' : '');
      sendBtn.textContent = 'Envoyer';
      updateBtn();
    }
  });
  conn.on('close', () => { ready = false; updateBtn(); setStatus('Connexion perdue, on se reconnecte…'); setTimeout(retry, 2000); });
}

let retrying = false;
function retry() {
  if (retrying || ready) return;
  retrying = true;
  setTimeout(() => { retrying = false; }, 3000);
  if (peer && peer.disconnected && !peer.destroyed) { try { peer.reconnect(); } catch (_) {} }
  if (peer && peer.open) openConn(); else connect();
}
// En revenant sur la page (après être allé chercher une photo), on vérifie la liaison
document.addEventListener('visibilitychange', () => { if (!document.hidden && !ready) retry(); });

// Réduit la photo (l'imprimante ne fait que 384 points de large) : envoi plus rapide
function shrink(file) {
  return new Promise((ok, ko) => {
    const img = new Image();
    img.onload = () => {
      const w = Math.min(768, img.width), h = Math.round(img.height * w / img.width);
      const c = document.createElement('canvas'); c.width = w; c.height = h;
      c.getContext('2d').drawImage(img, 0, 0, w, h);
      c.toBlob(b => b ? ok(b) : ko(new Error('conversion impossible')), 'image/jpeg', 0.85);
      URL.revokeObjectURL(img.src);
    };
    img.onerror = () => ko(new Error('photo illisible'));
    img.src = URL.createObjectURL(file);
  });
}

/* Aperçu du ticket : même traitement que la page de l'imprimante (traitement.js),
   dans le mode choisi là-bas (N&B ou Gris), à la taille réelle d'impression
   (384 points sur le petit côté, puisqu'une photo en largeur est imprimée tournée). */
let photoImg = null;
let hostMode = 'nb';        // mode choisi sur la page de l'imprimante (envoyé à la connexion)
let myMode = null;          // mode choisi ici par l'ami (null = celui de l'imprimante)
const MODE_NAMES = { nb: 'noir et blanc', gris: 'niveaux de gris' };
function modeNow() { return myMode || hostMode; }

function showModeButtons() {
  for (const b of document.querySelectorAll('#modeRow button'))
    b.className = b.dataset.mode === modeNow() ? '' : 'secondary';
}
for (const b of document.querySelectorAll('#modeRow button')) b.onclick = () => {
  myMode = b.dataset.mode; showModeButtons(); renderPreview(); saveLook();
};

function lookNow() {
  return {
    mode: modeNow(),
    bright: +document.getElementById('bright').value,
    contrast: +document.getElementById('contrast').value,
    auto: document.getElementById('autoEnhance').checked,
    fond: document.getElementById('removeBg').checked,
  };
}

/* Suppression du fond (v27, calcul dans traitement.js) : l'analyse prend un petit
   moment. L'aperçu montre d'abord la photo telle quelle, puis se met à jour. */
let fondEnCours = false, fondErreur = '';
async function preparerFond() {
  const hint = document.getElementById('fondHint');
  if (!photoImg || !document.getElementById('removeBg').checked) { hint.textContent = ''; return; }
  if (fondErreur) { hint.textContent = fondErreur; return; }
  const r = detourageResultat(photoImg);
  if (r) {
    hint.textContent = r.image ? '✓ Fond supprimé : seules les personnes sont gardées.'
                               : 'Aucune personne trouvée sur cette photo : le fond est gardé.';
    return;
  }
  if (fondEnCours) return;
  fondEnCours = true;
  hint.textContent = segmenteurCharge() ? '✂️ Suppression du fond…'
                                        : '✂️ Chargement de l\'outil de détourage (la première fois seulement)…';
  try { await detourerEnMemoire(photoImg); }
  catch (e) { console.warn(e); fondErreur = '⚠️ Suppression du fond impossible pour le moment. Décoche puis recoche la case pour réessayer.'; }
  finally { fondEnCours = false; }
  renderPreview();
}
document.getElementById('removeBg').onchange = () => { fondErreur = ''; renderPreview(); saveLook(); };

let previewPending = false;
function renderPreview() {
  preparerFond();   // lance la suppression du fond si besoin (sans attendre) et met le message à jour
  if (!photoImg || previewPending) return;
  previewPending = true;
  requestAnimationFrame(() => {               // un seul calcul par image affichée, même si on glisse vite
    previewPending = false;
    const w0 = photoImg.naturalWidth, h0 = photoImg.naturalHeight;
    const k = 384 / (w0 > h0 ? h0 : w0);
    const w = Math.round(w0 * k), h = Math.round(h0 * k);
    const c = document.getElementById('previewCanvas');
    c.width = w; c.height = h;
    const g = c.getContext('2d', { willReadFrequently: true });
    g.fillStyle = '#fff'; g.fillRect(0, 0, w, h);
    g.drawImage(document.getElementById('removeBg').checked ? imageDetouree(photoImg) : photoImg, 0, 0, w, h);
    const d = g.getImageData(0, 0, w, h), px = d.data;
    const gray = new Float32Array(w * h);
    for (let i = 0; i < gray.length; i++) gray[i] = 0.299 * px[i*4] + 0.587 * px[i*4+1] + 0.114 * px[i*4+2];
    const out = processPhoto(gray, w, h, modeNow() === 'gris', lookNow());
    for (let i = 0; i < out.length; i++) { px[i*4] = px[i*4+1] = px[i*4+2] = out[i]; px[i*4+3] = 255; }
    g.putImageData(d, 0, 0);
    c.hidden = false;
    document.getElementById('emptyMsg').hidden = true;
    const ml = document.getElementById('modeLabel');
    ml.hidden = false; ml.textContent = `Aperçu du ticket (${MODE_NAMES[modeNow()] || modeNow()})`;
  });
}

for (const id of ['bright', 'contrast']) {
  const el = document.getElementById(id);
  el.oninput = () => { document.getElementById(id + 'Val').textContent = el.value; showReset(); renderPreview(); saveLook(); };
}
document.getElementById('autoEnhance').onchange = () => { renderPreview(); saveLook(); };
function showReset() {
  document.getElementById('resetLook').hidden =
    +document.getElementById('bright').value === 0 && +document.getElementById('contrast').value === 0;
}
document.getElementById('resetLook').onclick = () => {
  for (const id of ['bright', 'contrast']) { document.getElementById(id).value = 0; document.getElementById(id + 'Val').textContent = '0'; }
  showReset(); renderPreview(); saveLook();
};
// On garde les réglages d'une photo à l'autre (souvent la même lumière)
function saveLook() { try { localStorage.setItem('x6h-reglages-ami', JSON.stringify(lookNow())); } catch (_) {} }
try {
  const l = JSON.parse(localStorage.getItem('x6h-reglages-ami') || 'null');
  if (l) {
    document.getElementById('bright').value = l.bright; document.getElementById('brightVal').textContent = l.bright;
    document.getElementById('contrast').value = l.contrast; document.getElementById('contrastVal').textContent = l.contrast;
    document.getElementById('autoEnhance').checked = l.auto !== false;
    document.getElementById('removeBg').checked = !!l.fond;
    if (l.mode === 'nb' || l.mode === 'gris') myMode = l.mode;
    showReset();
  }
} catch (_) {}

showModeButtons();

document.getElementById('fileInput').onchange = async e => {
  const f = e.target.files[0];
  if (!f) return;
  try {
    photo = await shrink(f);
    photoImg = await new Promise((ok, ko) => {
      const im = new Image(); im.onload = () => ok(im); im.onerror = () => ko(new Error('photo illisible'));
      im.src = URL.createObjectURL(photo);
    });
    document.getElementById('lookBox').hidden = false;
    renderPreview();
  } catch (err) { setStatus('Cette photo ne peut pas être lue : ' + err.message, 'err'); photo = null; photoImg = null; }
  e.target.value = '';
  updateBtn();
};

sendBtn.onclick = async () => {
  if (!ready || !photo) return;
  sendBtn.disabled = true; sendBtn.textContent = 'Envoi…';
  setStatus('Envoi en cours…');
  // Sans réponse au bout de 30 secondes, on laisse réessayer
  setTimeout(() => {
    if (sendBtn.textContent !== 'Envoi…') return;
    sendBtn.textContent = 'Envoyer'; updateBtn();
    setStatus('Pas de réponse du téléphone de l\'imprimante. Réessaie.', 'err');
  }, 30000);
  try {
    conn.send({ type: 'photo', from: fromEl.value.trim().slice(0, 30), image: await photo.arrayBuffer(), look: lookNow() });
  } catch (err) {
    setStatus('Envoi impossible : ' + err.message, 'err');
    sendBtn.textContent = 'Envoyer'; updateBtn();
  }
};

connect();
</script>
</body>
</html>
